name: Internship Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Send a Discord test message only"
        required: false
        default: false
        type: boolean
      notify_existing:
        description: "Notify all currently matching jobs (even if already baselined)"
        required: false
        default: false
        type: boolean

concurrency:
  group: internship-monitor
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Restore monitor state branch
        if: ${{ inputs.test_discord != true }}
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: .monitor-state
        continue-on-error: true

      - name: Load monitor state into data/
        if: ${{ inputs.test_discord != true }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [ -d .monitor-state ]; then
            shopt -s nullglob
            for f in .monitor-state/*.json .monitor-state/data/*.json; do
              cp "$f" "data/$(basename "$f")"
            done
            echo "Restored from monitor-state:"
            ls -la data || true
          else
            echo "No monitor-state branch yet; starting with empty data/"
          fi

      - name: Discord connectivity test
        if: ${{ inputs.test_discord == true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python check_jobs.py --test-discord

      - name: Run internship monitor
        if: ${{ inputs.test_discord != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.notify_existing }}" = "true" ]; then
            EXTRA_ARGS="--notify-existing"
          fi
          uv run python check_jobs.py $EXTRA_ARGS

      - name: Persist monitor state branch
        if: ${{ success() && inputs.test_discord != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No data/*.json to persist"
            exit 0
          fi

          STATE_DIR="$(mktemp -d)"
          cp "${files[@]}" "$STATE_DIR/"
          cat > "$STATE_DIR/README.md" <<'EOF'
# Monitor state (auto-generated)

Runtime JSON for JobOpeningNotifier Actions runs.

- Kept on the `monitor-state` branch only (not `main`)
- Safe to delete this branch for a full reset
- Do not open PRs from this branch
EOF

          cd "$STATE_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md *.json
          git commit -m "chore: update monitor state"
          git branch -M monitor-state
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin monitor-state
