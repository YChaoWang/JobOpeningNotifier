name: Internship Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Send a Discord test message only"
        required: false
        default: false
        type: boolean
      notify_existing:
        description: "Notify all currently matching jobs (even if already baselined)"
        required: false
        default: true
        type: boolean

concurrency:
  group: internship-monitor
  cancel-in-progress: false

permissions:
  contents: read
  models: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Restore monitor state cache
        if: ${{ inputs.test_discord != true }}
        uses: actions/cache/restore@v4
        with:
          path: data
          key: internship-monitor-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            internship-monitor-state-${{ github.repository }}-

      - name: Ensure data directory exists
        if: ${{ inputs.test_discord != true }}
        run: mkdir -p data

      - name: Discord connectivity test
        if: ${{ inputs.test_discord == true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python check_jobs.py --test-discord

      - name: Run internship monitor
        if: ${{ inputs.test_discord != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.notify_existing }}" = "true" ]; then
            EXTRA_ARGS="--notify-existing"
          fi
          uv run python check_jobs.py $EXTRA_ARGS

      - name: Save monitor state cache
        if: ${{ success() && inputs.test_discord != true }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: internship-monitor-state-${{ github.repository }}-${{ github.run_id }}
